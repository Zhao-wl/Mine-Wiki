<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 355" role="img" aria-label="点与位移的区别"><title>点与位移的区别</title><rect width="100%" height="100%" rx="12" fill="#f3f6eb"/><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="context-stroke"/></marker></defs><g font-family="system-ui, Noto Sans CJK SC, sans-serif" fill="#203d3b"><text x="30" y="38" font-size="22" fill="#203d3b">01  点随平移走；位移不跟着原点走</text><text x="70" y="82" font-size="18" fill="#203d3b">平移前</text><line x1="70" y1="250" x2="350" y2="250" stroke="#a4b8ad" stroke-width="1" marker-end="url(#arr)"/><line x1="70" y1="250" x2="70" y2="95" stroke="#a4b8ad" stroke-width="1" marker-end="url(#arr)"/><text x="510" y="82" font-size="18" fill="#203d3b">平移后 t=(3,2)</text><line x1="510" y1="250" x2="790" y2="250" stroke="#a4b8ad" stroke-width="1" marker-end="url(#arr)"/><line x1="510" y1="250" x2="510" y2="95" stroke="#a4b8ad" stroke-width="1" marker-end="url(#arr)"/><circle cx="120" cy="200" r="6" fill="#b4472d"/><circle cx="170" cy="200" r="6" fill="#b4472d"/><line x1="120" y1="200" x2="170" y2="200" stroke="#17685b" stroke-width="3" marker-end="url(#arr)"/><text x="112" y="232" font-size="18" fill="#203d3b">P</text><text x="166" y="232" font-size="18" fill="#203d3b">Q</text><text x="118" y="173" font-size="18" fill="#203d3b">d=(1,0)</text><circle cx="710" cy="100" r="6" fill="#b4472d"/><circle cx="760" cy="100" r="6" fill="#b4472d"/><line x1="710" y1="100" x2="760" y2="100" stroke="#17685b" stroke-width="3" marker-end="url(#arr)"/><text x="687" y="137" font-size="18" fill="#203d3b">P+t</text><text x="751" y="137" font-size="18" fill="#203d3b">Q+t</text><text x="650" y="182" font-size="18" fill="#203d3b">同一个 d=(1,0)</text><text x="70" y="278" font-size="16" fill="#203d3b">P=(1,1)，Q=(2,1)</text><text x="510" y="278" font-size="16" fill="#203d3b">P+t=(4,3)，Q+t=(5,3)</text><text x="32" y="325" font-size="18" fill="#203d3b">(Q+t)−(P+t) = Q−P；向量记录方向与长度，点记录位置。</text></g></svg>