<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" role="img" aria-label="子空间经局部矩阵和父世界矩阵到世界"><title>子空间经局部矩阵和父世界矩阵到世界</title><rect width="100%" height="100%" rx="12" fill="#f3f6eb"/><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="context-stroke"/></marker></defs><g font-family="system-ui, Noto Sans CJK SC, sans-serif" fill="#203d3b"><text x="30" y="38" font-size="22" fill="#203d3b">02  坐标经过每一层：右侧先执行</text><rect x="30" y="100" width="230" height="112" rx="12" fill="#e1eadc"/><text x="55" y="141" font-size="22" fill="#203d3b">子空间</text><text x="55" y="182" font-size="20" fill="#203d3b">p=(0,0)</text><rect x="325" y="100" width="230" height="112" rx="12" fill="#e1eadc"/><text x="350" y="141" font-size="22" fill="#203d3b">父空间</text><text x="350" y="182" font-size="20" fill="#203d3b">Lp=(1,1)</text><rect x="620" y="100" width="230" height="112" rx="12" fill="#e1eadc"/><text x="645" y="141" font-size="22" fill="#203d3b">世界空间</text><text x="645" y="182" font-size="20" fill="#203d3b">PLp=(2,4)</text><line x1="262" y1="155" x2="318" y2="155" stroke="#17685b" stroke-width="3" marker-end="url(#arr)"/><text x="282" y="130" font-size="18" fill="#203d3b">L</text><line x1="557" y1="155" x2="613" y2="155" stroke="#17685b" stroke-width="3" marker-end="url(#arr)"/><text x="575" y="130" font-size="18" fill="#203d3b">P</text><text x="30" y="264" font-size="21" fill="#203d3b">L=T(1,1)；P=M₂；世界矩阵 W=P·L</text><text x="30" y="303" font-size="18" fill="#203d3b">若还有祖先 G，继续得到 G·P·L。平移列也会受上游影响。</text></g></svg>