name: Lesson checks
on:
  push:
    branches: ['learning/**']
  pull_request:
    paths: ['content/**', 'assets/**', 'scripts/**', 'tests/**', 'knowledge/**', 'topics/**', 'lessons/**', 'index.html', 'README.md', '.github/workflows/lesson-checks.yml']
permissions:
  contents: read
jobs:
  lesson:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Math branches and numerical cases
        run: node --test lessons/zero-scale/tests/math.test.js
      - name: Content graph, references, states and compatibility
        run: python3 tests/content_test.py
      - name: Generated pages match their single source
        run: python3 scripts/build_site.py --check
